name: "arch-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - "feat**"
      - "fix**"
      - "hotfix**"
      - "chore**"
      - "main"
    paths:
      - "pkg/**.go"
      - ".go-arch-lint.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - "pkg/**.go"
      - ".go-arch-lint.yml"

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.19.1
      - name: Check architecture
        run: go-arch-lint check
