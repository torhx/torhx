name: "common-ci"

on:
  workflow_call:
    inputs:
      module:
        required: false
        type: string
        default: "."
      go_version:
        required: false
        type: string
        default: "1.27.4"
      linter_version:
        required: false
        type: string
        default: "2.15.0"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.module }}/go.sum
      - name: Install dependencies
        working-directory: ${{ inputs.module }}
        run: go mod download
      - name: Run tests
        working-directory: ${{ inputs.module }}
        run: go test -v -race -failfast -coverpkg=./... -covermode=atomic -coverprofile=coverage.tmp.out ./...
      - name: Exclude testdata
        working-directory: ${{ inputs.module }}
        run: grep -v "testdata" coverage.tmp.out > coverage.out && rm coverage.tmp.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.module }}/go.sum
      - name: Install lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ inputs.linter_version }}
      - name: Run lint
        working-directory: ${{ inputs.module }}
        run: golangci-lint run
